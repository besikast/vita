<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Мастер года 2026 | Ушакова Ю.И.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: url('фон.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Полупрозрачный оверлей для читаемости фона */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 0;
        }

        /* Декоративная жёлтая полоса сверху */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #FFD700;
            z-index: 100;
        }

        .welcome-card {
            position: relative;
            z-index: 1;
            background: #FFD700; /* ЯРКО-ЖЁЛТЫЙ ФОН */
            border-radius: 48px;
            padding: 48px 56px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.4);
            border: 2px solid #1a1a1a;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .year-badge {
            display: inline-block;
            background: #1a1a1a;
            color: #FFD700;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: 1px;
            border: 1px solid #1a1a1a;
        }

        .name {
            font-size: 2.6rem;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a1a;
            background: rgba(0, 0, 0, 0.1);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 60px;
            margin-bottom: 32px;
        }

        .start-btn {
            background: #1a1a1a;
            border: none;
            color: #FFD700;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 14px 42px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #1a1a1a;
        }

        .start-btn:hover {
            background: #ffffff;
            color: #1a1a1a;
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 32px;
            font-size: 0.7rem;
            color: #1a1a1a;
            font-weight: 600;
            opacity: 0.8;
        }

        @media (max-width: 550px) {
            .welcome-card {
                padding: 32px 24px;
            }
            .name {
                font-size: 1.8rem;
            }
            .title {
                font-size: 1rem;
                padding: 6px 18px;
            }
            .start-btn {
                font-size: 1rem;
                padding: 12px 32px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <div class="year-badge">⭐ Конкурс профессионального мастерства ⭐</div>
        <div class="name">Ушакова Юлия Игоревна</div>
        <div class="title">кандидат в звание «Мастер года 2026»</div>
        <button class="start-btn" id="startBtn">🚀 Начать занятие →</button>
        <div class="footer-note">Нажмите «Начать», чтобы перейти к интерактивным модулям</div>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            window.location.href = 'главная.html';
        });
    </script>
</body>
</html>
